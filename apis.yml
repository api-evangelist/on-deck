name: On Deck
description: >-
  On Deck (now operating as the On Deck Founder Fellowship, ODF) is a founder
  fellowship and startup community program that helps aspiring entrepreneurs
  start companies through an intense, in-person cohort experience focused on
  meeting co-founders, exploring ideas, and gaining conviction. Backed by Canaan
  Partners, On Deck provides mentorship, a peer community, and startup perks. It
  is a program and community platform rather than a developer or API product: as
  of this enrichment pass it publishes no public developer API, API
  documentation, or developer portal.
